name: TopFit CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coding-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check coding feature lint
        run: npm run lint:coding
      - name: Check interview feature lint
        run: npm run lint:interview
      - name: Verify interview APIs and scoring
        run: npm run test:interview
      - name: Verify every Python and SQL reference solution
        run: python3 scripts/verify-curriculum.py
      - name: Verify Python and SQLite execution workers
        run: npm run test:worker
      - name: Build production application
        run: npm run build
